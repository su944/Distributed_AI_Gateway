
services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      MOCK_PROVIDER_ENABLED: ${MOCK_PROVIDER_ENABLED:-true}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_CONNECT_TIMEOUT: ${OPENAI_CONNECT_TIMEOUT:-5s}
      OPENAI_RESPONSE_TIMEOUT: ${OPENAI_RESPONSE_TIMEOUT:-30s}
      OPENAI_REQUEST_TIMEOUT: ${OPENAI_REQUEST_TIMEOUT:-40s}
      DB_URL: jdbc:postgresql://postgres:5432/gateway
      DB_USERNAME: ${DB_USERNAME:-gateway}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      GATEWAY_API_KEY_PEPPER: ${GATEWAY_API_KEY_PEPPER:?Set GATEWAY_API_KEY_PEPPER}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-60}
      RATE_LIMIT_REFILL_RATE: ${RATE_LIMIT_REFILL_RATE:-1}
      RATE_LIMIT_REQUEST_COST: ${RATE_LIMIT_REQUEST_COST:-1}
      RATE_LIMIT_OUTAGE_POLICY: ${RATE_LIMIT_OUTAGE_POLICY:-FAIL_CLOSED}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: ${DB_USERNAME:-gateway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - gateway-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - gateway-redis:/data
volumes:
  gateway-redis:
  gateway-postgres:

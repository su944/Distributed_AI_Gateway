services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      MOCK_PROVIDER_ENABLED: ${MOCK_PROVIDER_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    stop_grace_period: 30s

spring:
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/gateway}
    username: ${DB_USERNAME:gateway}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: true
  application:
    name: distributed-ai-gateway
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

gateway:
  routing:
    # Built-in mock and enabled legacy OpenAI aliases are imported by ModelRegistry.
    # New aliases require explicit model grants in default-policy or tenants.
    models: {}
    tenants: {}
  rate-limit:
    outage-policy: ${RATE_LIMIT_OUTAGE_POLICY:FAIL_CLOSED}
    defaults:
      capacity: ${RATE_LIMIT_CAPACITY:60}
      refill-rate: ${RATE_LIMIT_REFILL_RATE:1}
      request-cost: ${RATE_LIMIT_REQUEST_COST:1}
  mock:
    enabled: ${MOCK_PROVIDER_ENABLED:true}
  openai:
    enabled: ${OPENAI_ENABLED:false}
    models:
      openai-chat: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
    response-timeout: ${OPENAI_RESPONSE_TIMEOUT:30s}
    request-timeout: ${OPENAI_REQUEST_TIMEOUT:40s}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
---

spring:
  config:
    activate:
      on-profile: local

management:
  endpoints:
    web:
      exposure:
        include: health
---
spring:
  config:
    activate:
      on-profile: test
server:
  port: 0

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs

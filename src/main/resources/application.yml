spring:
  application:
    name: distributed-ai-gateway
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

gateway:
  mock:
    enabled: ${MOCK_PROVIDER_ENABLED:true}
  openai:
    enabled: ${OPENAI_ENABLED:false}
    models:
      openai-chat: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
    response-timeout: ${OPENAI_RESPONSE_TIMEOUT:30s}
    request-timeout: ${OPENAI_REQUEST_TIMEOUT:40s}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: ${LOG_LEVEL:INFO}
---

spring:
  config:
    activate:
      on-profile: local

management:
  endpoints:
    web:
      exposure:
        include: health
---
spring:
  config:
    activate:
      on-profile: test
server:
  port: 0

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
